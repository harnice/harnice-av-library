# --- linear scale / slider (e.g. gain, level, sensitivity) ---------------------------------------------------------------
# - id: "gain"
#   type: slider              # or: scale / rating
#   label: "Input gain (dB)"
#   default: 0                # must fall within min/max below
#   validation:
#     minimum: -12
#     maximum: 12
#     multipleOf: 0.5
 
# --- conditional field (only show based on a previous answer) ---------------------------------------------------------------
# add this block under any field above:
#   show_if:
#     field: "other_field_id"
#     operator: equals          # equals | not_equals | contains | greater_than |
#                                # less_than | is_empty | is_not_empty
#     value: "some_answer"
 
 
