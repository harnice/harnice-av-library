# ============================================================================
# 1. REFERENCE — every field type + its typical rules
# Copy whichever block you need into `fields:` in the DEFINITION section.
# Every block includes `default:` — pick the empty/neutral value for the
# type unless you want the field pre-filled with something specific.
# ============================================================================
 
# --- short text -------------------------------------------------------------
# - id: "device_name"
#   type: text
#   label: "Device name"
#   required: true
#   default: ""
#   validation:
#     minLength: 2
#     maxLength: 60
#     pattern: "^[A-Za-z0-9\\- ]+$"       # optional regex
 
# --- long text ---------------------------------------------------------------
# - id: "install_notes"
#   type: textarea
#   label: "Installation notes"
#   default: ""
#   validation:
#     maxLength: 500
 
# --- url ---------------------------------------------------------------
# - id: "firmware_url"
#   type: url
#   label: "Firmware update URL"
#   default: ""
#   validation:
#     format: uri
 
# --- number ---------------------------------------------------------------
# - id: "port"
#   type: number
#   label: "Communication port"
#   default: 502
#   validation:
#     minimum: 1
#     maximum: 65535
#     multipleOf: 1        # step
 
# --- ip address ---------------------------------------------------------------
# - id: "device_ip"
#   type: ip_addr
#   label: "Device IP address"
#   default: ""
#   validation:
#     format: ipv4          # or: ipv6
#     pattern: "..."        # optional additional regex constraint
 
